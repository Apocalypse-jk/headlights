services:
  vault:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: token123
    healthcheck:
      test: VAULT_ADDR=http://localhost:8200 vault status
      start_period: 1m

  pki-setup:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    user: root
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: token123
    volumes:
      - ./pki-setup.sh:/pki-setup.sh:ro
      - pki:/pki
    command: sh /pki-setup.sh

  broker:
    image: samply/beam-broker:main
    depends_on:
      pki-setup:
        condition: service_completed_successfully
    environment:
      BIND_ADDR: 0.0.0.0:4000
      BROKER_URL: http://broker:4000
      PKI_ADDRESS: http://vault:8200
      PKI_APIKEY_FILE: /pki/pki.secret
      ROOTCERT_FILE: /pki/root.crt.pem
    volumes:
      - pki:/pki:ro

  proxy1:
    image: samply/beam-proxy:main
    depends_on:
      - broker
    ports:
      - 4001:4001
    environment:
      BIND_ADDR: 0.0.0.0:4001
      BROKER_URL: http://broker:4000
      PROXY_ID: proxy1.broker
      PRIVKEY_FILE: /pki/proxy1.priv.pem
      ROOTCERT_FILE: /pki/root.crt.pem
      APP_spot_KEY: pass123
      APP_prism_KEY: pass123
    volumes:
      - pki:/pki:ro

  # The real Beam proxy remains responsible for Broker communication,
  # authentication and decryption. It is reachable only inside Compose.
  proxy2:
    image: samply/beam-proxy:main
    depends_on:
      - broker
    environment:
      BIND_ADDR: 0.0.0.0:4002
      BROKER_URL: http://broker:4000
      PROXY_ID: proxy2.broker
      PRIVKEY_FILE: /pki/proxy2.priv.pem
      ROOTCERT_FILE: /pki/root.crt.pem
      APP_focus_KEY: pass123
    volumes:
      - pki:/pki:ro

  proxy3:
    image: samply/beam-proxy:main
    depends_on:
      - broker
    ports:
      - 4003:4003
    environment:
      BIND_ADDR: 0.0.0.0:4003
      BROKER_URL: http://broker:4000
      PROXY_ID: proxy3.broker
      PRIVKEY_FILE: /pki/proxy3.priv.pem
      ROOTCERT_FILE: /pki/root.crt.pem
      APP_focus_KEY: pass123
    volumes:
      - pki:/pki:ro

  proxy4:
    image: samply/beam-proxy:main
    depends_on:
      - broker
    ports:
      - 4004:4004
    environment:
      BIND_ADDR: 0.0.0.0:4004
      BROKER_URL: http://broker:4000
      PROXY_ID: proxy4.broker
      PRIVKEY_FILE: /pki/proxy4.priv.pem
      ROOTCERT_FILE: /pki/root.crt.pem
      APP_focus_KEY: pass123
    volumes:
      - pki:/pki:ro

  # Focus connects to this Beam-compatible facade instead of directly to proxy2.
  policy-proxy2:
    build:
      context: ./policy-engine/policy-proxy
    depends_on:
      - proxy2
    ports:
      - 4002:4002
    environment:
      BIND_ADDR: 0.0.0.0:4002
      UPSTREAM_BEAM_PROXY_URL: http://proxy2:4002
      POLICY_ENGINE_URL: http://policy-engine:8181
      INPUT_POLICY_PATH: /v1/data/input/allow_access
      OUTPUT_POLICY_PATH: /v1/data/output/allow_output
      BEAM_APP_ID: focus.proxy2.broker
      POLICY_FAIL_MODE: closed
      POLICY_TIMEOUT_MS: 5000
      UPSTREAM_TIMEOUT_MS: 120000
      MAX_BODY_BYTES: 20971520
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

volumes:
  pki:
