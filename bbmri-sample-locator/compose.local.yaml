services:
  lens:
    image: samply/bbmri-sample-locator:latest
    ports:
      - 3000:3000
    environment:
      PUBLIC_SPOT_URL: http://localhost:8055

  spot:
    image: samply/rustyspot:latest
    depends_on:
      - proxy1
    ports:
      - 8055:8055
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      BEAM_PROXY_URL: http://host.docker.internal:4001
      BEAM_APP_ID: spot.proxy1.broker
      BEAM_SECRET: pass123
      CORS_ORIGIN: http://localhost:3000
      PRISM_URL: http://host.docker.internal:8056
      TRANSFORM: LENS
      PROJECT: bbmri
      SITES: &sites proxy2

  focus:
    image: samply/focus:main
    depends_on:
      policy-proxy2:
        condition: service_healthy
      blaze:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      BEAM_PROXY_URL: http://policy-proxy2:4002
      BEAM_APP_ID_LONG: focus.proxy2.broker
      PROXY_ID: proxy2.broker
      API_KEY: pass123
      ENDPOINT_TYPE: blaze
      ENDPOINT_URL: http://blaze:8080/fhir/
      BLAZE_URL: http://blaze:8080/fhir/
      OBFUSCATE: no
      RETRY_COUNT: "120"

  blaze:
    image: samply/blaze:0.32
    ports:
      - 8080:8080
    healthcheck:
      test: curl -f http://localhost:8080/fhir/metadata
      start_period: 1m

  test-data-loader:
    image: samply/test-data-loader:master
    depends_on:
      blaze:
        condition: service_healthy
    environment:
      FHIR_STORE_URL: http://blaze:8080/fhir
      PATIENT_COUNT: "30000"

include:
  - ../compose.localbeam.yaml
  - ../policy-engine/compose.policy-engine.yaml
